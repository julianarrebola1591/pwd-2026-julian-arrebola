<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Practico 01</title>
</head>
<body>

    <div id="app" class="container-lg">
        <h1 class="mt-4">Practico N° 1</h1>
        <hr>
        <h2> Paso #2 </h2>
        <p>Nombre: {{nombre}}</p>
        <p>Edad: {{edad}}</p>
        <p>Ciudad: {{ciudad}}</p>
        <p>Hola, mi nombre es {{nombre}}, tengo {{edad}} años y vivo en {{ciudad}}.</p>
        <hr>
        <h2> Paso #3 </h2>
        <p>Contador: {{ contador }} </p>
        <button class="btn btn-primary" @click="sumar">Incrementar</button>
        <button class="btn btn-primary" @click="restar">Decrementar</button>
        <hr>
        
    </div>
    
<script>
    var app = new Vue({
    el: '#app',
    data: {
        nombre: "Julián",
        edad: 27,
        ciudad: "Madrid",
        contador: 0,
    },
    methods: {
        sumar () {
            this.contador += 1
        },
        restar () {
            this.contador -= 1
        }
    }, computed: {
        
    }
})
</script>
</body>
</html>
